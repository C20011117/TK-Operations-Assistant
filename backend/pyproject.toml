[project]
name = "tk-workspace"
version = "0.2.0"
description = "TK 多站点达人开发与内容运营工作台 - 桌面版后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "httpx>=0.28",
  "keyring>=25.5",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=1.0",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
build = [
  "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: 调用真实外部服务（FastMoss / LLM），默认跳过",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# 行长由 ruff format 统一处理；长 SQL / 中文提示语不强制折行
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
