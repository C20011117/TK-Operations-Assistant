name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # 目标平台只有 Windows，后端测试也在 Windows 上跑（凭据管理器、父进程看护等行为与 Linux 不同）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: 测试
        run: uv run pytest -q
      - name: OpenAPI 与前端类型一致
        shell: bash
        run: |
          uv run python -m tk_workspace.api.export_openapi ../apps/web/openapi.json
          git diff --exit-code ../apps/web/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 生成的类型与 openapi.json 一致
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build

  desktop:
    # 打出 Windows 安装包并作为构建产物上传
    needs: [backend, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: 构建安装包
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
