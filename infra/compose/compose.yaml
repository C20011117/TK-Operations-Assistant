# 本地开发与集成测试环境。启动：docker compose -f infra/compose/compose.yaml --env-file .env up -d
name: tk-workspace

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-tk_workspace}
  APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
  APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD}
  APP_DISPATCHER_PASSWORD: ${APP_DISPATCHER_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL_MATCHING: ${LLM_MODEL_MATCHING:-}
  FASTMOSS_MCP_URL: ${FASTMOSS_MCP_URL:-https://mcp.fastmoss.com/mcp}
  FASTMOSS_MCP_API_KEY: ${FASTMOSS_MCP_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?请在 .env 设置 POSTGRES_SUPERUSER_PASSWORD}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?请在 .env 设置 APP_OWNER_PASSWORD}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?请在 .env 设置 APP_RUNTIME_PASSWORD}
      APP_DISPATCHER_PASSWORD: ${APP_DISPATCHER_PASSWORD:?请在 .env 设置 APP_DISPATCHER_PASSWORD}
      DB_NAME: ${DB_NAME:-tk_workspace}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-tk_workspace}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO 官方自 2025-10 起不再在 Docker Hub 发布社区版镜像；默认使用社区维护的加固构建（内含 minio 与 mc）。
    # 可在 .env 用 MINIO_IMAGE 换成自建镜像。
    image: ${MINIO_IMAGE:-cloudpirates/image-minio:RELEASE.2025-10-15T17-29-55Z-hardened}
    # 该镜像入口脚本把第一个参数当数据目录，这里直接运行 minio
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?请在 .env 设置 OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?请在 .env 设置 OBJECT_STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: ${MINIO_IMAGE:-cloudpirates/image-minio:RELEASE.2025-10-15T17-29-55Z-hardened}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      BUCKET: ${OBJECT_STORAGE_BUCKET:-tk-workspace-dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY" &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        mc anonymous set none "local/$$BUCKET" &&
        echo "bucket ready: $$BUCKET"
    restart: "no"

  worker:
    build:
      context: ../../backend
    command: ["celery", "-A", "tk_workspace.workers.celery_app", "worker", "-Q", "default", "-c", "2", "--loglevel", "INFO"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    build:
      context: ../../backend
    command: ["python", "-m", "tk_workspace.platform.outbox.dispatcher"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
